aid: genesis-ai
name: Genesis AI
description: >-
  Genesis AI is a physical-AI company building a universal robotics foundation
  model and a full-stack platform for general-purpose robots. Founded in 2024 by
  Zhou Xian and Théophile Gervet, it emerged from stealth in July 2025 with $105M
  in seed funding from Eclipse, Khosla Ventures, Bpifrance, HSG, Eric Schmidt, and
  Xavier Niel. Its stack spans the GENE vision-language-action foundation model
  (GENE-26.5), the Eno general-purpose robot, and Genesis World, a multi-physics
  simulation platform that generates synthetic training data and is developed in
  the open as the `genesis-world` Python package. The company is pre-product with
  customer deployments targeted for the end of 2026; its primary public developer
  surface today is the open-source Genesis simulation stack on PyPI, GitHub, and
  Read the Docs rather than a hosted web API.
